laravel: '@testbench'

providers:
  - Workbench\App\Providers\WorkbenchServiceProvider
  - Brume\BrumeServiceProvider
  # Dev-dependency providers are not auto-discovered by Testbench; the 驗證碼示範 page needs it.
  - Mews\Captcha\CaptchaServiceProvider

migrations:
  - workbench/database/migrations

workbench:
  start: '/admin'
  install: false
  health: false
  # Linked into the skeleton's public/ while `testbench serve` runs: the 商品說明 editor's
  # contentCss and the seeded sample's images (/storefront/...).
  sync:
    - from: ./workbench/public/storefront
      to: public/storefront
  discovers:
    web: false
    api: false
    commands: false
    components: false
    views: false
  build:
    - create-sqlite-db
    - migrate-fresh:
        --seed: true
        --seeder: Workbench\Database\Seeders\DatabaseSeeder
