name: CI

on:
  push:
    branches: [main, phase-1, phase-2]
  pull_request:
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Generate Linux baselines; inspect PNGs and then require normal non-update CI
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: php ${{ matrix.php }} / laravel ${{ matrix.laravel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        include:
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'
        # Laravel 12 needs PHP ^8.2 and Laravel 13 needs PHP ^8.3, so every combination is supported.
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, mbstring, intl
          coverage: none
          tools: composer:v2

      - name: Pin laravel/framework ${{ matrix.laravel }}
        run: |
          composer require --dev --no-update --no-interaction \
            "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --with-all-dependencies --no-interaction --no-progress
          composer show laravel/framework | grep -E '^versions'

      - run: composer lint

      - name: Test with failure annotations
        run: bash scripts/ci-tests.sh

      - name: Preserve PHP test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.php }}-${{ strategy.job-index }}-tests
          path: .ci-test-results/
          include-hidden-files: true

  mysql:
    name: mysql 8.4 / php 8.5 / laravel 13.*
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: brume_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psecret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # The same Pest suite as the php jobs, on MySQL (tests/TestCase.php reads these).
      BRUME_TEST_DB: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: brume_test
      DB_USERNAME: root
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, pdo_sqlite, sqlite3, mbstring, intl
          coverage: none
          tools: composer:v2

      - name: Pin laravel/framework 13.*
        run: |
          composer require --dev --no-update --no-interaction \
            "laravel/framework:13.*" "orchestra/testbench:^11.0"
          composer update --prefer-dist --with-all-dependencies --no-interaction --no-progress
          composer show laravel/framework | grep -E '^versions'

      - name: Test with failure annotations
        run: bash scripts/ci-tests.sh

      - name: Preserve MySQL test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-tests
          path: .ci-test-results/
          include-hidden-files: true

  frontend:
    name: frontend dist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm --dir frontend install --frozen-lockfile

      # Rebuilds the precompiled frontend and compares it byte for byte with the committed dist/.
      - run: node frontend/scripts/check-dist.mjs

  e2e:
    name: e2e (reviewed UI source)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      BRUME_UI_INTEGRATION: '1'
      BRUME_UI_SOURCE: ${{ github.workspace }}/.ci/ui-source
      # PR text never opts into writes. The generated bot commit deliberately omits the marker.
      UPDATE_SNAPSHOTS: ${{ (github.event_name == 'workflow_dispatch' && inputs['update-snapshots'] == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[update-snapshots]')) }}
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, intl
          coverage: none
          tools: composer:v2

      - run: composer install --prefer-dist --no-interaction --no-progress

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: e2e/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            e2e/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - run: pnpm --dir e2e install --frozen-lockfile

      # The workbench runs in vite (--frontend) mode; e2e/serve.sh builds it from frontend/.
      - run: pnpm --dir frontend install --frozen-lockfile

      - name: Read immutable reviewed UI pin
        id: ui-pin
        run: |
          node -e 'const p = require("./.ci/ui-integration.json"); if (p.repository !== "brume-ui/brume-ui" || !/^[0-9a-f]{40}$/.test(p.sha)) process.exit(1); require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `sha=${p.sha}\n`);'

      - uses: actions/checkout@v5
        with:
          repository: brume-ui/brume-ui
          ref: ${{ steps.ui-pin.outputs.sha }}
          path: .ci/ui-source
          persist-credentials: false

      - name: Build reviewed UI and link five package origins
        run: |
          pnpm --dir .ci/ui-source install --frozen-lockfile
          pnpm --dir .ci/ui-source build
          node e2e/ui-integration.mjs --prepare

      - name: Install Playwright Chromium
        run: pnpm --dir e2e exec playwright install --with-deps chromium

      - name: E2E (normal acceptance)
        if: ${{ env.UPDATE_SNAPSHOTS != 'true' }}
        run: pnpm --dir e2e exec playwright test

      - name: E2E (explicit Linux snapshot generation)
        if: ${{ env.UPDATE_SNAPSHOTS == 'true' }}
        run: pnpm --dir e2e exec playwright test --update-snapshots

      - name: Commit only generated Linux PNGs after the full browser suite
        if: ${{ env.UPDATE_SNAPSHOTS == 'true' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'e2e/tests/*-snapshots/*-linux.png'
          if git diff --cached --quiet; then
            echo 'No snapshot changes.'
          else
            git commit -m 'test(workbench): update Linux form screenshot baselines'
            git push
          fi

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  smoke:
    name: install smoke (laravel ${{ matrix.laravel }} / ${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12', '13']
        mode: [precompiled, vite]
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, intl
          coverage: none
          tools: composer:v2

      - uses: pnpm/action-setup@v4
        if: ${{ matrix.mode == 'vite' }}
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        if: ${{ matrix.mode == 'vite' }}
        with:
          node-version: 24

      - run: bin/smoke-install.sh ${{ matrix.laravel }} ${{ matrix.mode }}
